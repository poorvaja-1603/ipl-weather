- id: 1
  question: Which venue has the highest chase win rate with at least 20 matches?
  gold_sql: |
    SELECT venue_id, venue_name, chase_win_pct
    FROM `{{ project }}.marts.mart_venue_stats`
    WHERE matches_played >= 20
    ORDER BY chase_win_pct DESC
    LIMIT 1

- id: 2
  question: Which venue has the highest chase win rate when humidity is high?
  gold_sql: |
    SELECT v.venue_name,
      ROUND(100 * SAFE_DIVIDE(COUNTIF(m.chasing_team_won), COUNTIF(m.result_type != 'no_result')), 2) AS chase_win_pct
    FROM `{{ project }}.marts.fct_match` AS m
    JOIN `{{ project }}.marts.dim_venue` AS v USING (venue_id)
    WHERE m.humidity_band = 'high'
    GROUP BY v.venue_name
    HAVING COUNTIF(m.result_type != 'no_result') >= 10
    ORDER BY chase_win_pct DESC
    LIMIT 1

- id: 3
  question: What is the average first innings score for each humidity band?
  gold_sql: |
    SELECT humidity_band, ROUND(AVG(first_innings_runs), 2) AS avg_first_innings_runs
    FROM `{{ project }}.marts.fct_match`
    WHERE humidity_band IS NOT NULL
    GROUP BY humidity_band
    ORDER BY humidity_band

- id: 4
  question: Does high dew risk increase the chance of a successful chase?
  gold_sql: |
    SELECT dew_risk_band,
      ROUND(100 * SAFE_DIVIDE(COUNTIF(chasing_team_won), COUNTIF(result_type != 'no_result')), 2) AS chase_win_pct
    FROM `{{ project }}.marts.fct_match`
    WHERE dew_risk_band IS NOT NULL
    GROUP BY dew_risk_band
    ORDER BY dew_risk_band

- id: 5
  question: Who scored the most runs in each season?
  gold_sql: |
    WITH ranked AS (
      SELECT batter, season_year, runs,
        ROW_NUMBER() OVER (PARTITION BY season_year ORDER BY runs DESC, batter) AS row_num
      FROM `{{ project }}.marts.mart_batter_season`
    )
    SELECT season_year, batter, runs
    FROM ranked
    WHERE row_num = 1
    ORDER BY season_year

- id: 6
  question: Which batter has the best strike rate in high humidity with at least 300 balls faced?
  gold_sql: |
    SELECT batter, strike_rate, runs, balls_faced
    FROM `{{ project }}.marts.mart_batter_weather`
    WHERE humidity_band = 'high' AND balls_faced >= 300
    ORDER BY strike_rate DESC
    LIMIT 1

- id: 7
  question: What is each team's win percentage at Wankhede Stadium?
  gold_sql: |
    WITH team_matches AS (
      SELECT team1_id AS team_id, winner_id
      FROM `{{ project }}.marts.fct_match`
      WHERE venue_id = 'wankhede' AND result_type != 'no_result'
      UNION ALL
      SELECT team2_id AS team_id, winner_id
      FROM `{{ project }}.marts.fct_match`
      WHERE venue_id = 'wankhede' AND result_type != 'no_result'
    )
    SELECT team_id, COUNT(*) AS matches, COUNTIF(winner_id = team_id) AS wins,
      ROUND(100 * SAFE_DIVIDE(COUNTIF(winner_id = team_id), COUNT(*)), 2) AS win_pct
    FROM team_matches
    GROUP BY team_id
    ORDER BY win_pct DESC

- id: 8
  question: How has the share of teams choosing to field after winning the toss changed by season?
  gold_sql: |
    SELECT season_year,
      ROUND(100 * SAFE_DIVIDE(COUNTIF(toss_decision = 'field'), COUNT(*)), 2) AS field_toss_pct
    FROM `{{ project }}.marts.fct_match`
    GROUP BY season_year
    ORDER BY season_year

- id: 9
  question: At which venues does winning the toss matter most?
  gold_sql: |
    SELECT venue_id, venue_name, toss_winner_match_win_pct, matches_played
    FROM `{{ project }}.marts.mart_venue_stats`
    WHERE matches_played >= 20
    ORDER BY toss_winner_match_win_pct DESC
    LIMIT 5

- id: 10
  question: What was the highest team total and what was the weather in that match?
  gold_sql: |
    SELECT m.match_id, m.season_year, i.total_runs AS highest_score,
      m.avg_temp_c, m.avg_humidity_pct, m.dew_spread_c
    FROM `{{ project }}.marts.fct_innings` AS i
    JOIN `{{ project }}.marts.fct_match` AS m USING (match_id)
    ORDER BY i.total_runs DESC
    LIMIT 1

- id: 11
  question: Which 5 bowlers have the best economy with at least 500 balls bowled?
  gold_sql: |
    WITH bowler_stats AS (
      SELECT bowler,
        SUM(runs_conceded) AS total_runs,
        SUM(balls_bowled) AS total_balls
      FROM `{{ project }}.marts.mart_bowler_season`
      GROUP BY bowler
      HAVING SUM(balls_bowled) >= 500
    )
    SELECT bowler,
      ROUND(SAFE_DIVIDE(total_runs * 6, total_balls), 2) AS economy,
      total_balls AS balls_bowled
    FROM bowler_stats
    ORDER BY economy ASC
    LIMIT 5

- id: 12
  question: How many matches had rain recorded and how many were affected by DL?
  gold_sql: |
    SELECT COUNTIF(total_precip_mm > 0) AS matches_with_rain,
      COUNTIF(dl_applied) AS dl_affected_matches
    FROM `{{ project }}.marts.fct_match`

- id: 13
  question: What was the hottest match and who won it?
  gold_sql: |
    SELECT match_id, season_year, match_date, avg_temp_c, winner_id
    FROM `{{ project }}.marts.fct_match`
    WHERE avg_temp_c IS NOT NULL
    ORDER BY avg_temp_c DESC
    LIMIT 1

- id: 14
  question: What is Mumbai Indians' win percentage by humidity band?
  gold_sql: |
    SELECT humidity_band, COUNT(*) AS matches, COUNTIF(winner_id = 'MI') AS wins,
      ROUND(100 * SAFE_DIVIDE(COUNTIF(winner_id = 'MI'), COUNT(*)), 2) AS win_pct
    FROM `{{ project }}.marts.fct_match`
    WHERE (team1_id = 'MI' OR team2_id = 'MI')
      AND humidity_band IS NOT NULL AND result_type != 'no_result'
    GROUP BY humidity_band
    ORDER BY humidity_band

- id: 15
  question: What is the average score in hot matches compared with cool matches?
  gold_sql: |
    SELECT temp_band, ROUND(AVG(first_innings_runs), 2) AS avg_first_innings_runs
    FROM `{{ project }}.marts.fct_match`
    WHERE temp_band IN ('hot', 'cool')
    GROUP BY temp_band
    ORDER BY temp_band

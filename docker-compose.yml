version: '3.8'

x-airflow-common: &airflow-common
  build: .
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    - AIRFLOW__CORE__FERNET_KEY=FB42_FB42_FB42_FB42_FB42_FB42_FB42_FB42_FB42=
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__LOGGING_LEVEL=INFO
    - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    - AIRBYTE_API_URL=${AIRBYTE_API_URL:-http://host.docker.internal:8000}
    - AIRBYTE_CLIENT_ID=${AIRBYTE_CLIENT_ID}
    - AIRBYTE_CLIENT_SECRET=${AIRBYTE_CLIENT_SECRET}
    - AIRBYTE_CRICKET_CONNECTION_ID=${AIRBYTE_CRICKET_CONNECTION_ID}
    - AIRBYTE_WEATHER_CONNECTION_ID=${AIRBYTE_WEATHER_CONNECTION_ID}
    - GCP_PROJECT_ID=${GCP_PROJECT_ID}
    - BQ_LOCATION=${BQ_LOCATION:-US}
    - GCP_KEYFILE_DBT=/opt/airflow/secrets/dbt-sa.json
    - BQ_MAX_BYTES_BILLED=${BQ_MAX_BYTES_BILLED:-1000000000}
    - IPL_MATCHES_URL=${IPL_MATCHES_URL}
    - IPL_DELIVERIES_URL=${IPL_DELIVERIES_URL}
    - OPEN_METEO_ARCHIVE_URL=${OPEN_METEO_ARCHIVE_URL}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./dbt:/opt/airflow/dbt
    - ./bi:/opt/airflow/bi
    - ./secrets:/opt/airflow/secrets:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  airflow-init:
    <<: *airflow-common
    command: version
    entrypoint:
      - bash
      - -c
      - |
        airflow db init && \
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:

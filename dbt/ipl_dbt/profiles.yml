ipl_dbt:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_DBT_USER') }}"
      password: "{{ env_var('SNOWFLAKE_DBT_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_DBT_ROLE', 'TRANSFORM_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'IPL_DB') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'IPL_WH') }}"
      schema: STAGING
      threads: 4
      client_session_keep_alive: False

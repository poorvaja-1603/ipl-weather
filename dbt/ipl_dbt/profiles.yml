ipl_dbt:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GCP_KEYFILE_DBT') }}"
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: staging
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 4
      maximum_bytes_billed: "{{ env_var('BQ_MAX_BYTES_BILLED', '1000000000') | int }}"
      execution_project: "{{ env_var('GCP_PROJECT_ID') }}"

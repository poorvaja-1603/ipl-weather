version: 2

sources:
  - name: raw
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'IPL_DB') }}"
    schema: RAW
    loaded_at_field: _airbyte_extracted_at
    freshness:
      warn_after: {count: 7, period: day}
    tables:
      - name: ipl_matches
        description: Raw IPL matches ingested via Airbyte
      - name: ipl_deliveries
        description: Raw IPL ball-by-ball deliveries ingested via Airbyte
      - name: weather_hourly
        description: Raw historical weather partitions ingested from Open-Meteo via Airbyte

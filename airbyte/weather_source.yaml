version: 0.81.0
type: DeclarativeSource
spec:
  type: Spec
  connection_specification:
    $schema: "http://json-schema.org/draft-07/schema#"
    type: "object"
    required: []
    properties: {}
check:
  type: CheckStream
  stream_names:
    - weather_hourly
streams:
  - type: DeclarativeStream
    name: weather_hourly
    primary_key:
      - venue_id
      - start_date
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: https://archive-api.open-meteo.com/v1/
        path: archive
        http_method: GET
        request_parameters:
          latitude: "{{ stream_partition.latitude }}"
          longitude: "{{ stream_partition.longitude }}"
          start_date: "{{ stream_partition.start_date }}"
          end_date: "{{ stream_partition.end_date }}"
          hourly: temperature_2m,relative_humidity_2m,dew_point_2m,precipitation,wind_speed_10m
          timezone: auto
        error_handler:
          type: DefaultErrorHandler
          backoff_strategies:
            - type: ExponentialBackoffStrategy
              factor: 2
          max_retries: 5
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - hourly
      partition_router:
        type: ListPartitionRouter
        values:
          - venue_id: "wankhede"
            latitude: 18.9389
            longitude: 72.8258
            start_date: "2024-03-22"
            end_date: "2024-05-26"
          - venue_id: "chinnaswamy"
            latitude: 12.9788
            longitude: 77.5996
            start_date: "2024-03-22"
            end_date: "2024-05-26"
          - venue_id: "chepauk"
            latitude: 13.0628
            longitude: 80.2793
            start_date: "2024-03-22"
            end_date: "2024-05-26"
          - venue_id: "eden_gardens"
            latitude: 22.5646
            longitude: 88.3433
            start_date: "2024-03-22"
            end_date: "2024-05-26"
          - venue_id: "motera"
            latitude: 23.0917
            longitude: 72.5975
            start_date: "2024-03-22"
            end_date: "2024-05-26"
          - venue_id: "feroz_shah"
            latitude: 28.6378
            longitude: 77.2423
            start_date: "2024-03-22"
            end_date: "2024-05-26"
          - venue_id: "uppal"
            latitude: 17.4065
            longitude: 78.5505
            start_date: "2024-03-22"
            end_date: "2024-05-26"
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: "http://json-schema.org/draft-07/schema#"
        type: object
        properties:
          venue_id:
            type:
              - "string"
              - "null"
          start_date:
            type:
              - "string"
              - "null"
          end_date:
            type:
              - "string"
              - "null"
          time:
            type:
              - "array"
              - "null"
          temperature_2m:
            type:
              - "array"
              - "null"
          relative_humidity_2m:
            type:
              - "array"
              - "null"
          dew_point_2m:
            type:
              - "array"
              - "null"
          precipitation:
            type:
              - "array"
              - "null"
          wind_speed_10m:
            type:
              - "array"
              - "null"
    transformations:
      - type: AddFields
        fields:
          - path:
              - venue_id
            value: "{{ stream_partition.venue_id }}"
          - path:
              - start_date
            value: "{{ stream_partition.start_date }}"
          - path:
              - end_date
            value: "{{ stream_partition.end_date }}"
